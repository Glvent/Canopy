[package]
name = "canopy-ratatui-reference"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "underline-color", "widget-calendar"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "=0.3.47"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
